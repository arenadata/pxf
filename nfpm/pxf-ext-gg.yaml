name: pxf-ext-gg${GG_VER}
arch: "amd64"
platform: "linux"
version: "${VER}"
section: "default"
priority: "extra"
maintainer: "Arenadata Team <team@arenadata.com>"
replaces:
provides:
  - pxf-ext-gg${GG_VER}
depends:
  - grengage${GG_VER}
recommends:
suggests:
conflicts:
description: |
        This package contains extensions part of PXF
        The PXF package with FDW extension provides connection pool for the Greengage Database
        PXF is an extensible framework that allows a distributed database like
        Greengage to query external data files, whose metadata is not managed by
        the database.
        PXF includes built-in connectors for accessing data that exists inside HDFS
        files, Hive tables, HBase tables, JDBC-accessible databases and more.
        Users can also create their own connectors to other data storage or
        processing engines.
vendor: "arenadata"
